schema_version = 1
shutdown_grace = "5s"

[listener.web]
listen = "0.0.0.0:19671"
mode = "http"
backend = "api"
maxconn = 4096

[backend.api]
balance = "roundrobin"
servers = [
  { addr = "172.30.92.10:19030" },
  { addr = "172.30.92.11:19030" },
]

[backend.api.health_check]
type = "http"
http_path = "/healthz"
interval = "200ms"
timeout = "100ms"
fall = 2
rise = 2
expect_status = "200"
