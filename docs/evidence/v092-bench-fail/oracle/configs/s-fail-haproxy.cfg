global
  maxconn 4096
defaults
  mode http
  option http-keep-alive
  timeout connect 1s
  timeout client 30s
  timeout server 30s
  timeout http-request 5s
  timeout check 100ms
  default-server inter 200ms fall 2 rise 2
frontend web
  bind *:19681
  default_backend api
backend api
  option httpchk GET /healthz
  http-check expect status 200
  server s1 172.30.92.10:19030 check
  server s2 172.30.92.11:19030 check
