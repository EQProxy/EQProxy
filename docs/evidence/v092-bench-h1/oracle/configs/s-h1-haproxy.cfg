global
  log stdout format raw local0
  maxconn 4096
defaults
  log global
  mode http
  option httplog
  option http-keep-alive
  timeout connect 5s
  timeout client 60s
  timeout server 60s
  timeout http-request 5s
frontend web
  bind *:19611
  default_backend api
backend api
  server s1 172.21.0.2:19002 maxconn 4096
