global
  maxconn 4096
  stats socket /usr/local/etc/haproxy/admin.sock mode 666 level admin
defaults
  mode http
  option http-keep-alive
  timeout connect 1s
  timeout client 30s
  timeout server 30s
  timeout http-request 5s
  timeout queue 5s
frontend web
  bind *:19731
  maxconn 16
  default_backend api
backend api
  server s1 172.30.94.10:19050 maxconn 16
