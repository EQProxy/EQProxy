global
  log stdout format raw local0
  maxconn 4096
  ssl-default-bind-ciphersuites TLS_AES_256_GCM_SHA384
  ssl-default-bind-options ssl-min-ver TLSv1.3 ssl-max-ver TLSv1.3
defaults
  log global
  mode http
  option httplog
  option http-keep-alive
  timeout connect 5s
  timeout client 60s
  timeout server 60s
  timeout http-request 5s
frontend web
  bind *:19631 ssl crt /certs/haproxy.pem alpn http/1.1
  default_backend api
backend api
  server s1 172.22.0.2:19002 maxconn 4096
