schema_version = 1
shutdown_grace = "30s"

[listener.web]
listen = "127.0.0.1:34023"
backend = "api"
mode = "http"
maxconn = 4096
connect_timeout = "2s"
idle_timeout = "30s"
client_header_timeout = "5s"
server_header_timeout = "10s"
forwarded_headers = "append"

[backend.api]
servers = [
  { addr = "127.0.0.1:33911", weight = 1 },
  { addr = "127.0.0.1:44383", weight = 1 },
]
maxqueue = 256
timeout_queue = "500ms"
retries = 1

[backend.api.health_check]
type = "tcp"
interval = "5s"
timeout = "2s"
fall = 3
rise = 2
passive = true
