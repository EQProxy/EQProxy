# Generado por `eqproxy config import`.
# Revise el informe de conversión antes de usarlo en producción.
schema_version = 1

[backend.api_v2]
servers = [{ addr = "127.0.0.1:64010", weight = 5 }, { addr = "127.0.0.1:64011", weight = 2 }]

[backend.app]
servers = [{ addr = "127.0.0.1:64007", weight = 3 }, { addr = "127.0.0.1:64008" }, { addr = "127.0.0.1:64009", backup = true }]
balance = "leastconn"

[backend.backend_127_0_0_1_64012]
server = "127.0.0.1:64012"

[listener.web_ejemplo_com]
listen = "0.0.0.0:64006"
mode = "http"
backend = "app"
idle_timeout = "65s"
client_header_timeout = "10s"
forwarded_headers = "append"

[listener.web_ejemplo_com.tls]
cert = "/var/folders/7z/2dgl35v966d7hs3w_jbg8klr0000gn/T//eqproxy-corpus-e2e.GUlhA0/certs/ejemplo.pem"
key = "/var/folders/7z/2dgl35v966d7hs3w_jbg8klr0000gn/T//eqproxy-corpus-e2e.GUlhA0/certs/ejemplo.key"
alpn = ["h2", "http/1.1"]
min_version = "1.2"

[[listener.web_ejemplo_com.tls.certs]]
cert = "/var/folders/7z/2dgl35v966d7hs3w_jbg8klr0000gn/T//eqproxy-corpus-e2e.GUlhA0/certs/panel.pem"
key = "/var/folders/7z/2dgl35v966d7hs3w_jbg8klr0000gn/T//eqproxy-corpus-e2e.GUlhA0/certs/panel.key"
names = ["panel.ejemplo.com"]

[listener.web_ejemplo_com.compression]
gzip = true

[[listener.web_ejemplo_com.rules]]
name = "server ejemplo.com location /api/"
use_backend = "api_v2"
path_prefix = "/api/"
host = "ejemplo.com"
set_headers = [{ name = "Host", value = "$host" }]
response_headers = [{ name = "X-Frame-Options", value = "SAMEORIGIN" }]

[[listener.web_ejemplo_com.rules]]
name = "server ejemplo.com location /"
use_backend = "app"
path_prefix = "/"
host = "ejemplo.com"
set_headers = [{ name = "Host", value = "$host" }, { name = "X-Real-IP", value = "$remote_addr" }]

[[listener.web_ejemplo_com.rules]]
name = "server panel.ejemplo.com location /"
use_backend = "backend_127_0_0_1_64012"
path_prefix = "/"
host = "panel.ejemplo.com"
