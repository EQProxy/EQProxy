# Two vhosts share 443. nginx applies version, cipher and client-certificate
# policy per server; an EQProxy listener has one policy for every name. The
# default_server's TLS 1.3 and no-mTLS policy must win, and the second vhost
# must be reported as degraded on all three lost properties.
http {
  server {
    listen 443 ssl default_server;
    server_name a.example;
    ssl_certificate /etc/nginx/tls/a.example.pem;
    ssl_certificate_key /etc/nginx/tls/a.example.key;
    ssl_protocols TLSv1.3;
    ssl_ciphers HIGH:!aNULL;
    location / { proxy_pass http://127.0.0.1:9100; }
  }

  server {
    listen 443 ssl;
    server_name b.example;
    ssl_certificate /etc/nginx/tls/b.example.pem;
    ssl_certificate_key /etc/nginx/tls/b.example.key;
    ssl_protocols TLSv1.2;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256;
    ssl_client_certificate /etc/nginx/tls/clients.pem;
    ssl_verify_client on;
    location / { proxy_pass http://127.0.0.1:9101; }
  }
}
