[workspace]

[package]
name = "eqproxy_lints"
version = "0.1.0"
authors = ["The EQProxy Authors"]
description = "EQProxy project-specific Dylint lints"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dylint_linting = "6.0"

[dev-dependencies]
dylint_testing = "6.0"

[package.metadata.rust-analyzer]
rustc_private = true
